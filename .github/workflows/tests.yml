name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# An older run on the same branch is canceled when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # CPU builds of torch and torchvision: the tests never use CUDA.
      # viz for test_viz.py; the spatial and wsi tests run in the extras and floors jobs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,viz]"

      # ruff keeps its format within a minor release: the floors' 0.16.0 and 0.16 here agree.
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      # -rs lists each skipped test with its reason, so a lost dependency shows as a shorter run.
      - name: Test
        run: pytest -rs

  # Every extra at its latest release, as a new install resolves it.
  extras:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,viz,spatial,wsi]"

      - name: Test
        run: pytest -rs

  # Every dependency at the lowest release pyproject.toml allows, pinned in ci/constraints-min.txt.
  floors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # torchvision 0.17.0 is the release paired with torch 2.2.0, from the CPU index.
      - name: Install the floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.0 torchvision==0.17.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c ci/constraints-min.txt -e ".[dev,viz]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest -rs

  # Each extra at its floor, the core resolved freely: the spatial stack needs newer core releases.
  floors-spatial:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the spatial extra at its floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c ci/constraints-min-extras.txt -e ".[dev,viz,spatial]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest -rs

  # A job of its own: tiffslide 2.5.1 needs zarr 2, and spatialdata 0.8.0 needs zarr 3.
  floors-wsi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the wsi extra at its floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c ci/constraints-min-extras.txt -e ".[dev,viz,wsi]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest -rs
