site_name: ALHENA
site_description: "ALHENA, an H&E encoder distilled from transcriptomic foundation models for multi-scale slide analysis."
site_url: https://prism-oncology.github.io/ALHENA/
repo_url: https://github.com/prism-oncology/ALHENA
repo_name: prism-oncology/ALHENA
edit_uri: edit/main/docs/
copyright: BSD 3-Clause

theme:
  name: material
  logo: assets/alhena_lockup_reverse.svg
  favicon: assets/alhena_mark_512.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
      # Only .ipynb files are notebooks: Markdown pages and Python files are never read as such.
      ignore: ["*.md", "*.py"]
      # hide-cell drops a cell and hide-input its code; only the first tag of each list is read.
      remove_tag_config:
        remove_cell_tags: [hide-cell]
        remove_input_tags: [hide-input]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start:
      - Getting started: start/getting-started.md
      - Demo notebook: start/demo.ipynb
      - Choose your task: start/choose-your-task.md
  - Inputs:
      - inputs/index.md
      - Images: inputs/images.md
      - Nuclei: inputs/nuclei.md
      - Coordinates: inputs/coordinates.md
      - References: inputs/references.md
  - Outputs:
      - outputs/index.md
      - Tile embeddings: outputs/tile-embeddings.md
      - Cell embeddings: outputs/cell-embeddings.md
      - Cell annotations: outputs/cell-annotations.md
      - Downstream analysis: outputs/downstream-analysis.md
      - Persistence and interchange: outputs/persistence.md
  - Tutorials:
      - tutorials/index.md
      - 1. Tile embeddings: tutorials/01_tile_embeddings.ipynb
      - 2. Cell embeddings: tutorials/02_cell_embeddings.ipynb
      - 3. Cell annotation: tutorials/03_cell_annotation.ipynb
      - 4. Multi-scale slide analysis: tutorials/04_multiscale_analysis.ipynb
      - 5. Custom reference: tutorials/05_custom_reference.ipynb
      - 6. Annotation evaluation: tutorials/06_annotation_evaluation.ipynb
  - Use case example: use-case/crc_multiscale.ipynb
  - Concepts:
      - How ALHENA works: concepts/how-it-works.md
      - Geometry: concepts/geometry.md
      - Cell pooling: concepts/cell-pooling.md
      - Cell typing: concepts/cell-typing.md
      - References: concepts/references.md
  - Reference:
      - Installation: installation.md
      - Command line: cli.md
      - Python API:
          - api/index.md
          - Encoder: api/encoder.md
          - Cell typer: api/celltyper.md
          - Reading data: api/io.md
          - Preprocessing: api/preprocess.md
          - Cells and pooling: api/cells.md
          - Retrieval: api/annotate.md
          - References: api/reference.md
          - Building a reference: api/refbuild.md
          - Scoring: api/metrics.md
          - SpatialData: api/spatial.md
          - Plotting: api/viz.md
          - Types: api/types.md
          - Errors and warnings: api/errors.md
          - Constants: api/constants.md
  - FAQ: faq.md
  - Cite: cite.md
